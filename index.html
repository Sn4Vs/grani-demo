<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Интерактивный макет фитнес-клуба Грани в Сыктывкаре.">
<title>Грани изнутри — интерактивный макет</title>
<style>body{margin:0;background:#f8f7f4}</style>
</head>
<body>
<section id="grani-demo" aria-label="Грани. Интерактивный макет клуба">
  <header class="gr-head">
    <div class="gr-brand"><img data-brand alt="Грани"><span>ФИТНЕС-КЛУБ</span></div>
    <span class="gr-place">Сыктывкар <span aria-hidden="true">·</span> Станционная, 152</span>
  </header>
  <div class="gr-content">
    <div class="gr-intro">
      <h1>Грани изнутри</h1>
      <p>Выберите этаж, чтобы увидеть клуб в разрезе.</p>
    </div>
    <nav class="gr-nav" aria-label="Выбор этажа">
      <button type="button" data-floor="all" aria-pressed="true">Фасад</button>
      <button type="button" data-floor="1" aria-pressed="false">1-й этаж</button>
      <button type="button" data-floor="2" aria-pressed="false">2-й этаж</button>
      <button type="button" data-floor="3" aria-pressed="false">3-й этаж</button>
      <button type="button" data-floor="roof" aria-pressed="false">Крыша</button>
    </nav>
    <div class="gr-layout">
      <div class="gr-stage">
        <canvas aria-label="Объёмный макет здания. Для выбора этажа используйте кнопки или наведите указатель на фасад." role="img"></canvas>
        <div class="gr-stage-top"><span class="gr-dot"></span><span data-status>Вид снаружи</span></div>
        <div class="gr-labels" aria-hidden="true" data-labels></div>
        <div class="gr-stage-note" data-note>Наведите на этаж · Нажмите, чтобы закрепить</div>
      </div>
      <aside class="gr-detail" aria-label="Зоны выбранного этажа">
        <figure class="gr-figure">
          <img data-photo alt="">
          <figcaption data-caption></figcaption>
        </figure>
        <div class="gr-detail-body">
          <div class="gr-kicker" data-level>Обзор клуба</div>
          <h2 data-title>Фасад «Граней»</h2>
          <ul data-zones class="gr-zones"></ul>
        </div>
      </aside>
    </div>
    <p class="gr-foot">Демо для презентации <span>·</span> Схематичная планировка</p>
    <span class="gr-sr" aria-live="polite" data-announcement></span>
  </div>
</section>
<style>
#grani-demo {
  --gr-bg: #f8f7f4;
  --gr-text: #241f1c;
  --gr-muted: #625952;
  --gr-line: #dcd5ca;
  --gr-accent: #ad4825;
  background: var(--gr-bg);
  color: var(--gr-text);
  font: 400 15px/1.45 "Inter", "Segoe UI", sans-serif;
  overflow: hidden;
  text-align: left;
}
#grani-demo *, #grani-demo *::before, #grani-demo *::after { box-sizing: border-box; }
#grani-demo .gr-head {
  min-height: 60px; padding: 0 clamp(14px, 3vw, 34px);
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  border-bottom: 1px solid var(--gr-line);
}
#grani-demo .gr-brand { display: flex; align-items: center; gap: 11px; }
#grani-demo .gr-brand img { width: 86px; max-height: 36px; display: block; object-fit: contain; filter: brightness(0) saturate(100%); }
#grani-demo .gr-brand span, #grani-demo .gr-place { font-size: 11px; color: var(--gr-muted); }
#grani-demo .gr-brand span { letter-spacing: .09em; font-weight: 700; white-space: nowrap; }
#grani-demo .gr-place { text-align: right; }
#grani-demo .gr-place span { padding: 0 3px; }
#grani-demo .gr-content { padding: 22px clamp(14px, 3vw, 34px) 16px; max-width: 1380px; margin: auto; }
#grani-demo h1, #grani-demo h2, #grani-demo p, #grani-demo figure, #grani-demo ul { margin: 0; }
#grani-demo h1 { font-size: clamp(36px, 5.5vw, 68px); line-height: .99; font-weight: 730; letter-spacing: -.065em; }
#grani-demo .gr-intro p { margin-top: 9px; color: var(--gr-muted); }
#grani-demo .gr-nav { display: flex; flex-wrap: wrap; gap: 7px; margin: 19px 0 12px; }
#grani-demo .gr-nav button {
  min-height: 38px; padding: 6px 14px; border: 1px solid var(--gr-line); border-radius: 4px;
  background: transparent; color: var(--gr-text); line-height: 1.3;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
#grani-demo .gr-nav button:hover { background: #ece4db; }
#grani-demo .gr-nav button[aria-pressed="true"] { background: #29231f; color: #fffaf2; border-color: #29231f; }
#grani-demo .gr-nav button[data-preview="true"] { box-shadow: inset 0 -3px 0 #ba532f; }
#grani-demo .gr-nav button:focus-visible { outline: 2px solid var(--gr-accent); outline-offset: 2px; }
#grani-demo .gr-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(224px, .35fr); gap: 12px; align-items: stretch; }
#grani-demo .gr-stage {
  position: relative; isolation: isolate; overflow: hidden; background: #99989f;
  min-height: 388px; border: 1px solid #d6cab9; border-radius: 6px;
}
#grani-demo canvas { width: 100%; height: 100%; display: block; position: absolute; inset: 0; touch-action: pan-y; }
#grani-demo .gr-stage-top {
  position: absolute; pointer-events: none; top: 15px; left: 15px; display: flex; align-items: center; gap: 8px;
  padding: 6px 9px; background: #faf6ee; border: 1px solid #d7c9b7;
  border-radius: 3px; font-size: 11px; font-weight: 650;
}
#grani-demo .gr-dot { width: 7px; height: 7px; border-radius: 50%; background: #b85632; }
#grani-demo .gr-stage-note {
  position: absolute; pointer-events: none; bottom: 11px; left: 12px;
  padding: 5px 8px; color: #4c4138; background: #f7f1e7e8; border-radius: 3px; font-size: 11px;
}
#grani-demo .gr-labels { position: absolute; inset: 0; pointer-events: none; }
#grani-demo .gr-marker {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
  border: 1px solid #e5d2b6; border-radius: 3px; padding: 3px 6px; background: #2e2823;
  color: #fff5e7; font-size: 11px; font-weight: 600; box-shadow: 0 2px 6px #25130b32;
}
#grani-demo .gr-marker::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 8px; background: #46382f; }
#grani-demo .gr-detail { border: 1px solid var(--gr-line); border-radius: 6px; overflow: hidden; background: #fffdfa; }
#grani-demo .gr-figure { position: relative; background: #302a26; aspect-ratio: 1.75; overflow: hidden; }
#grani-demo .gr-figure img { display: block; width: 100%; height: 100%; object-fit: cover; }
#grani-demo .gr-figure figcaption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 19px 12px 8px; color: #fff9f0; font-size: 11px;
  background: linear-gradient(transparent, #16110edb);
}
#grani-demo .gr-detail-body { padding: 14px 15px 15px; }
#grani-demo .gr-kicker { color: #8b3a20; font-size: 11px; font-weight: 700; letter-spacing: .055em; text-transform: uppercase; }
#grani-demo h2 { font-size: 22px; line-height: 1.13; letter-spacing: -.03em; font-weight: 710; margin-top: 4px; }
#grani-demo .gr-zones { padding: 0; list-style: none; margin-top: 10px; }
#grani-demo .gr-zones li { padding: 5px 0; border-top: 1px solid #ede6dc; font-size: 12.5px; }
#grani-demo .gr-foot { margin-top: 10px; color: var(--gr-muted); font-size: 11px; }
#grani-demo .gr-foot span { padding: 0 3px; }
#grani-demo .gr-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (min-width: 1080px) {
  #grani-demo .gr-stage { min-height: clamp(385px, calc(100svh - 270px), 540px); }
  #grani-demo .gr-content { padding-top: 24px; }
}
@media (max-width: 700px) {
  #grani-demo .gr-layout { grid-template-columns: 1fr; }
  #grani-demo .gr-stage { min-height: clamp(255px, 61vw, 420px); }
  #grani-demo .gr-detail { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1fr); }
  #grani-demo .gr-figure { aspect-ratio: auto; min-height: 138px; }
  #grani-demo .gr-figure img { position: absolute; inset: 0; }
  #grani-demo .gr-marker { display: none; }
  #grani-demo .gr-detail-body { padding: 11px 10px; }
  #grani-demo h2 { font-size: 18px; }
}
@media (max-width: 390px) {
  #grani-demo .gr-brand span { display: none; }
  #grani-demo .gr-nav button { padding-inline: 10px; }
  #grani-demo .gr-detail { grid-template-columns: 1fr; }
  #grani-demo .gr-figure { min-height: 150px; }
}
@media (pointer: coarse) { #grani-demo .gr-nav button { min-height: 44px; } }
</style>

    tile(40,211,402,16,z+.5,'#6c5842');
    railing(36,208,410,0,z);
    railing(36,208,0,22,z);
    railing(446,208,0,22,z);
    railing(36,230,410,0,z);
    for (let x=38;x<449;x+=27) treadmill(x,237,z);
    rower(454,192,z);
    for (let x of [22,197,361,460]) block(x,222,7,7,z,29,'#a36c4e','#8d5136','#693e2e');
  }
  function studios(z) {
    tile(7,7,476,246,z,bake?.recording?'#514b43':'#665f59');

    // The back wall reads from left to right: Hall 1, Cycle, cinema, Hall 2.
    tile(12,12,96,82,z+.1,'#c6a780');
    front(12,12,96,z,21,'#af8c67');
    side(108,12,82,z,14,'#ad9d87');
    for (let x=24;x<96;x+=18) front(x,12,14,z+7,9,'#d7d5c1');

    tile(113,12,126,95,z+.1,'#454c52');
    front(113,12,126,z,21,'#52636a');
    side(239,12,95,z,14,'#737674');
    for (const [y,count] of [[31,6],[56,6],[82,5]]) {
      const startX = count === 6 ? 119 : 129;
      for (let i=0;i<count;i++) exerciseBike(startX+i*19,y,z);
    }

    tile(245,12,137,112,z+.1,'#393e42');
    front(245,12,137,z,25,'#41474a');
    front(253,12,122,z+5,19,'#20282e','#181d21');
    front(257,12,114,z+7,15,'#87a6b2','#adbec4');
    if (bake?.recording) {
      front(258,12,112,z+8,13,'#303c49');
      front(261,12,106,z+9,11,'#65899c');
      front(263,12,102,z+9.5,2.3,'#b79c7d');
      front(263,12,102,z+11.8,1,'#a6a49a');
      for (const [x,w,light] of [[12,96,'#ffe0ad'],[113,126,'#ffbb70'],[245,137,'#b8dafe'],[387,91,'#ffe0ad']]) {
        block(x,15,w,1.3,z+20,.66,light);
      }
      block(12,104,96,1.2,z+19,.66,'#ffe0ad');
      bake.localLight(93,105,z+49,'#ffc587',3600,136);
      bake.localLight(269,78,z+50,'#a9d9ff',3400,131);
      bake.localLight(408,171,z+53,'#ffc78d',3400,137);
    }
    for (let x of [255,286,317,348]) {
      treadmill(x,46,z);
      exerciseBike(x,75,z);
      rower(x,99,z);
    }
    side(382,12,112,z,14,'#77716c');

    tile(387,12,91,109,z+.1,'#c3a37c');
    front(387,12,91,z,21,'#a6805e');
    side(478,12,109,z,14,'#887660');
    for (let x=396;x<472;x+=18) front(x,12,14,z+7,9,'#ddd5c2');

    tile(12,103,96,70,z+.1,'#be9f73');
    front(12,103,96,z,19,'#aaa34e');
    side(108,103,70,z,13,'#a6a04c');
    for (let x of [21,48,75]) {
      front(x,105,21,z+10,6,'#e4dbbc');
      for (let y of [123,151]) tile(x,y,17,9,z+.3,'#8e5960');
    }

    tile(12,183,221,69,z+.1,'#5d615c','#918e7e');
    tile(238,159,239,93,z+.1,'#515050');
    const ringX = 306;
    const ringY = 168;
    const ringSize = 77;
    block(ringX,ringY,ringSize,ringSize,z,5,'#51738a','#283842','#313d45');
    for (let x of [ringX,ringX+ringSize]) {
      for (let y of [ringY,ringY+ringSize]) block(x-2,y-2,4,4,z+4,16,'#e5ddd3','#a54336','#74433e');
    }
    for (let height of [10,14,18]) {
      edge([[ringX,ringY,z+height],[ringX+ringSize,ringY,z+height],[ringX+ringSize,ringY+ringSize,z+height],[ringX,ringY+ringSize,z+height],[ringX,ringY,z+height]],height===14?'#e1dfd9':'#b95649',1.1);
    }
  }
  const interiors = [reception,pool,studios];
  function roof(top, alpha, active) {
    layer(alpha, () => {
      tile(0,0,width,depth,top,'#9f9383','#635b50');
      tile(10,11,470,237,top+.4,'#b9ac96');
      tile(125,27,329,184,top+.6,'#70815d');
      for (let x=135;x<454;x+=17) edge([[x,29,top+1],[x,208,top+1]],'#a9ae7959',1);
      block(19,21,86,76,top,24,'#85837a','#605f5b','#52504b');
      for(let i=0;i<3;i++) block(29+i*22,36,14,27,top+24,4,'#aaa394','#6d6b61');
      for (let y of [66,110,154]) for (let x of [178,235,292,349,406]) {
        for (let dx of [2,22]) block(x+dx,y,2,10,top+.8,2,'#655d4f');
        block(x,y,26,10,top+2.4,1.5,'#e4d3a9','#a78654');
        polygon([[x,y,top+8],[x+9,y,top+4],[x+9,y+10,top+4],[x,y+10,top+8]],'#e9d8b3');
      }
      side(width-2,0,depth,top,10,'#86796d');
      front(0,0,width,top,10,'#a48c70');
      if (active) edge([[0,depth,top+2],[width,depth,top+2]],'#f6dc9a',2.2);
      else {
        front(0,depth,width,top,10,'#a34f31','#e0aa71');
        side(width,0,depth,top,10,'#6c5544','#af9374');
      }
    });
  }
  function outline(z) {
    if (bake?.recording) return;
    const h = levelHeight;
    const ink = '#6e584d38';
    edge([[0,0,z+h],[width,0,z+h],[width,depth,z+h],[0,depth,z+h],[0,0,z+h]],ink,1.1);
    edge([[width,0,z],[width,0,z+h]],ink,1);
    edge([[0,depth,z],[0,depth,z+h]],ink,1);
    edge([[width,depth,z],[width,depth,z+h]],ink,1);
  }
  function drawModel() {
    ground();
    let below = 0;
    for (let index=0;index<3;index++) {
      const z = index * levelHeight;
      const opening = cut[index];
      const aboveOpacity = 1-below;
      layer(aboveOpacity, () => {
        block(0,0,width,depth,z,4,'#a3917f','#634a3e','#6b5145');
        layer(opening, () => interiors[index](z+4));
        facade(index,z,1-opening);
        layer(opening, () => {
          edge([[0,0,z+4],[0,depth,z+4],[width,depth,z+4]],'#f6dca8',2.3);
          edge([[0,0,z+4],[0,depth,z+4],[width,depth,z+4]],'#a45335',.9);
        });
      });
      layer(below, () => outline(z));
      below = Math.min(1,below+opening);
    }
    roof(3*levelHeight,1-below,cut[3]>.5);
    if (!bake?.recording) layer(below, () => {
      const z=3*levelHeight;
      edge([[0,0,z],[width,0,z],[width,depth,z],[0,depth,z],[0,0,z]],'#7356474b',1.2);
    });
  }
  function draw() {
    ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
    ctx.clearRect(0,0,logicalWidth,logicalHeight);
    ctx.translate(offsetX,offsetY);
    ctx.scale(scale,scale);
    drawModel();
  }
  function animate(now) {
    animationFrame = 0;
    const elapsed = lastFrame ? Math.min(now-lastFrame,40) : 16;
    lastFrame = now;
    let moving = false;
    if (scene) {
      moving=scene.tick(now,elapsed);
      placeLabels();
    } else {
      for (let i=0;i<levels.length;i++) {
        const target = displayed === levels[i] ? 1 : 0;
        const difference = target-cut[i];
        if (Math.abs(difference)<.012 || reduceMotion.matches) cut[i]=target;
        else {
          cut[i] += difference * Math.min(.45,elapsed/78);
          moving = true;
        }
      }
      if (ctx) draw();
    }
    if (moving) animationFrame=requestAnimationFrame(animate);
    else lastFrame=0;
  }
  function schedule() {
    if (!animationFrame && (scene || ctx)) animationFrame=requestAnimationFrame(animate);
  }
  const labelBox = root.querySelector('[data-labels]');
  function arrangeLabels() {
    const z = displayed === 'roof' ? 3*levelHeight : (Number(displayed)-1)*levelHeight+4;
    labelBox.innerHTML = details[displayed].labels.map(([name,x,y,h]) => {
      if (scene) {
        const [u,v]=scene.project(x,y,z+h);
        return '<span class="gr-marker" style="left:'+(u*100/logicalWidth).toFixed(2)+'%;top:'+((v-8)*100/logicalHeight).toFixed(2)+'%">'+name+'</span>';
      }
      const [u,v] = project(x,y,z+h);
      const left = ((u*scale+offsetX)*100/logicalWidth).toFixed(2);
      const top = ((v*scale+offsetY-8)*100/logicalHeight).toFixed(2);
      return '<span class="gr-marker" style="left:'+left+'%;top:'+top+'%">'+name+'</span>';
    }).join('');
  }
  function placeLabels() {
    if (!labelBox.children?.length) return;
    const z=displayed==='roof'?3*levelHeight:(Number(displayed)-1)*levelHeight+4;
    details[displayed].labels.forEach(([,x,y,h],i)=>{
      const [u,v]=scene.project(x,y,z+h);
      const label=labelBox.children[i];
      label.style.left=u+'px';
      label.style.top=(v-8)+'px';
      label.hidden=u<34 || u>logicalWidth-34 || v<40 || v>logicalHeight-12;
    });
  }
  function sizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    logicalWidth = Math.max(1,rect.width);
    logicalHeight = Math.max(1,rect.height);
    pixelRatio = Math.min(devicePixelRatio || 1,2);
    if (scene) scene.resize(logicalWidth,logicalHeight);
    else {
      canvas.width = Math.round(logicalWidth*pixelRatio);
      canvas.height = Math.round(logicalHeight*pixelRatio);
    }
    scale = Math.min(logicalWidth/790,logicalHeight/480);
    offsetX = logicalWidth/2-462*scale;
    offsetY = logicalHeight/2-318*scale;
    arrangeLabels();
    schedule();
  }
  function show() {
    const next = hovered || pinned;
    scene?.setView(next,pinned,reduceMotion.matches);
    if (scene) schedule();
    buttons.forEach(button => {
      button.setAttribute('aria-pressed',String(button.dataset.floor===pinned));
      button.dataset.preview = String(button.dataset.floor===hovered && hovered!==pinned);
    });
    if (displayed===next) return;
    displayed=next;
    root.dataset.current=next;
    const info=details[next];
    for (let property of ['title','level','status','caption']) root.querySelector('[data-'+property+']').textContent=info[property];
    const photo=root.querySelector('[data-photo]');
    if (media[info.photo]) photo.src=media[info.photo];
    photo.alt=info.caption.split(' · ')[0];
    root.querySelector('[data-zones]').innerHTML=info.zones.map(zone=>'<li>'+zone+'</li>').join('');
    arrangeLabels();
    schedule();
  }
  function lock(floor) {
    pinned=floor;
    hovered=null;
    show();
    root.querySelector('[data-announcement]').textContent=details[floor].status+' — '+details[floor].title;
    window.openai?.setWidgetState?.({modelContent:{floor}})?.catch(()=>{});
  }
  function contains(point, shape) {
    let inside=false;
    for(let i=0,j=shape.length-1;i<shape.length;j=i++) {
      const [x1,y1]=shape[i], [x2,y2]=shape[j];
      if ((y1>point[1]) !== (y2>point[1]) && point[0] < (x2-x1)*(point[1]-y1)/(y2-y1)+x1) inside=!inside;
    }
    return inside;
  }
  const roofZ=3*levelHeight;
  const hitAreas=[['roof',[[0,0,roofZ],[width,0,roofZ],[width,depth,roofZ],[0,depth,roofZ]]]];
  for(let i=2;i>=0;i--) {
    const z=i*levelHeight, h=z+levelHeight;
    hitAreas.push([levels[i],[[0,depth,h],[width,depth,h],[width,0,h],[width,0,z],[width,depth,z],[0,depth,z]]]);
  }
  const projectedAreas=hitAreas.map(([id,shape])=>[id,shape.map(p=>project(...p))]);
  function hit(event) {
    const rect=canvas.getBoundingClientRect();
    if (scene) return scene.pick(event.clientX-rect.left,event.clientY-rect.top);
    const point=[(event.clientX-rect.left-offsetX)/scale,(event.clientY-rect.top-offsetY)/scale];
    return projectedAreas.find(([,shape])=>contains(point,shape))?.[0] || null;
  }
  buttons.forEach(button=>button.addEventListener('click',()=>lock(button.dataset.floor)));
  canvas.addEventListener('pointermove',event=>{
    if (event.pointerType!=='mouse') return;
    hovered=hit(event);
    canvas.style.cursor=hovered?'pointer':'default';
    show();
  });
  canvas.addEventListener('pointerleave',()=>{
    hovered=null;
    show();
  });
  canvas.addEventListener('click',event=>{
    const floor=hit(event);
    if (floor) lock(floor);
  });
  root.addEventListener('keydown',event=>{
    if (event.key==='Escape') lock('all');
  });
  window.addEventListener?.('openai:set_globals',event=>{
    const floor=event.detail?.globals?.widgetState?.modelContent?.floor;
    if (!Object.hasOwn(details,floor)) return;
    pinned=floor;
    hovered=null;
    show();
  });
  const saved=window.openai?.widgetState?.modelContent?.floor;
  if (Object.hasOwn(details,saved)) pinned=saved;
  if (scene) {
    scene.setup({
      ground,
      floors:interiors.map((inside,i)=>{
        const z=i*levelHeight;
        return {
          base:()=>block(.22,.22,width-.44,depth-.44,z,4,'#a3917f','#634a3e','#6b5145'),
          outside:()=>facade(i,z,1),
          inside:()=>inside(z+4),
        };
      }),
      roof:()=>roof(3*levelHeight,1,false),
    },schedule);
    root.dataset.renderer='webgl';
  } else {
    root.dataset.renderer='schematic';
  }
  show();
  sizeCanvas();
  new ResizeObserver(sizeCanvas).observe(canvas);
  if (!scene) root.querySelector('[data-note]').textContent='Схематичный вид · 3D недоступно в этом браузере';
  else if (matchMedia('(pointer: coarse)').matches) root.querySelector('[data-note]').textContent='Коснитесь этажа на макете';
  canvas.addEventListener('webglcontextrestored',sizeCanvas);
})();
</script>
